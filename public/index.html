
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THYQORA OS</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="shortcut icon" href="/favicon.svg?v=2">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="application-name" content="THYQORA OS">
<meta name="theme-color" content="#07111f">

<!-- QR-Code-Bibliothek -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

:root {
    --accent: #1685df;
    --panel: #17243b;
    --panel-light: #263c5c;
    --text: white;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background: linear-gradient(135deg,#173b70,#101b3c,#315d91);
    user-select: none;
}

button, input, select {
    font: inherit;
}

button {
    color: white;
}

/* AUTHENTICATOR */

.auth-screen {
    position: fixed;
    inset: 0;
    z-index: 20000;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow-y: auto;
    background:
        radial-gradient(circle at top,#244c7d,transparent 55%),
        linear-gradient(135deg,#07111f,#101b3c);
}

.auth-panel {
    width: min(430px,100%);
    padding: 32px;
    text-align: center;
    background: #17243bf2;
    border: 1px solid #ffffff30;
    border-radius: 18px;
    box-shadow: 0 20px 70px #0009;
    margin: auto;
}

.auth-logo {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 8px;
}

.auth-logo img {
    width: 76px;
    height: 76px;
    filter: drop-shadow(0 0 18px #1685df88);
}

.auth-panel h1 {
    letter-spacing: 5px;
    margin-bottom: 5px;
}

.auth-panel p {
    color: #b9c8dd;
}

.auth-panel form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 25px;
}

.auth-panel input,
.auth-panel select {
    width: 100%;
    padding: 14px;
    color: white;
    background: #0b1729;
    border: 1px solid #ffffff30;
    border-radius: 8px;
    outline: none;
}

.auth-panel input:focus,
.auth-panel select:focus {
    border-color: #56b4ff;
}

.auth-panel form button {
    padding: 14px;
    color: white;
    background: #1676c5;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
}

.auth-panel form button:hover {
    background: #258fe5;
}

.auth-panel button:disabled {
    opacity: .6;
    cursor: wait;
}

.auth-switch {
    margin-top: 20px;
    background: transparent;
    border: 0;
    color: #70bdff;
    cursor: pointer;
}

.auth-extra {
    display: none;
}

.auth-help {
    font-size: 12px;
    line-height: 1.5;
}

.auth-error {
    min-height: 20px;
    color: #ff8585 !important;
    font-size: 13px;
}

.secret-box {
    padding: 12px;
    margin: 10px 0;
    background: #07111f;
    border: 1px solid #56b4ff;
    border-radius: 8px;
    overflow-wrap: anywhere;
    user-select: text;
}

.secret-box code {
    color: #70bdff;
    font-size: 13px;
}

#authQr {
    display: flex;
    justify-content: center;
    width: max-content;
    max-width: 100%;
    margin: 15px auto;
    padding: 12px;
    background: white;
    border-radius: 10px;
}

#authQr img,
#authQr canvas {
    max-width: 100%;
}

/* DESKTOP */

body:not(.authenticated) .desktop,
body:not(.authenticated) .taskbar,
body:not(.authenticated) .start-menu,
body:not(.authenticated) .notification-center {
    display: none !important;
}

body.authenticated #authScreen {
    display: none;
}

.desktop {
    position: relative;
    height: 100vh;
    padding: 20px;
}

.desktop-widget-layer { position:absolute; inset:0; z-index:5; pointer-events:none; overflow:hidden; }
.desktop-widget { position:absolute; width:min(245px, calc(100vw - 32px)); box-sizing:border-box; }
.desktop-widget {
    min-width: 0;
    padding: 12px;
    color: white;
    background: #101d31eF;
    border: 1px solid #ffffff30;
    border-left: 3px solid var(--accent);
    border-radius: 12px;
    box-shadow: 0 10px 28px #0005;
    backdrop-filter: blur(18px);
    pointer-events: auto;
    cursor: grab;
}
.desktop-widget:active { cursor: grabbing; }
.desktop-widget h3 { margin:0 25px 8px 0; font-size:12px; color:#c5d9f0; font-weight:600; user-select:none; -webkit-user-select:none; }
.desktop-widget h3:active { cursor:grabbing; }
.desktop-widget-value { font-size: 25px; font-weight: 700; }
.desktop-widget-sub { margin-top: 4px; color: #b9c8dd; font-size: 11px; }
.desktop-widget-weather { display:flex; align-items:center; gap:10px; }
.desktop-widget-weather .weather-icon { font-size: 34px; }
.desktop-widget-weather strong { font-size: 25px; }
.desktop-widget-remove {
    position:absolute; top:5px; right:6px; width:23px; height:23px;
    padding:0; margin:0; border:0; border-radius:6px; color:#dcecff;
    background:#ffffff16; cursor:pointer;
}
.desktop-widget-remove:hover { background:#a83242; }
.widget-center {
    position: fixed;
    top: 72px;
    right: 16px;
    z-index: 12000;
    width: min(340px, calc(100vw - 24px));
    max-height: min(70vh, 560px);
    overflow:auto;
    padding: 16px;
    display:none;
    color:white;
    background:#14243bf5;
    border:1px solid #ffffff35;
    border-radius:14px;
    box-shadow:0 18px 50px #0009;
    backdrop-filter:blur(22px);
}
.widget-center h3 { margin:0 0 5px; }
.widget-center p { margin:0 0 12px; color:#b9c8dd; font-size:12px; }
.widget-center-list { display:flex; flex-direction:column; gap:8px; }
.widget-center-row { display:flex; align-items:center; gap:10px; padding:10px; background:#ffffff0d; border:1px solid #ffffff20; border-radius:9px; }
.widget-center-row .widget-center-meta { flex:1; min-width:0; }
.widget-center-row small { display:block; color:#b9c8dd; margin-top:3px; font-size:11px; }
.widget-center-row button { margin:0; padding:7px 10px; }
.widget-center-row button:disabled { opacity:.45; cursor:not-allowed; }
@media(max-width:1024px) {
    .desktop-widget { width:min(230px, calc(100vw - 32px)); }
    .widget-center { top:max(66px, env(safe-area-inset-top)); right:12px; width:min(360px, calc(100vw - 24px)); max-height:calc(100dvh - 100px); }
    .widget-center-row { align-items:flex-start; }
    .widget-center-row button { min-height:40px; flex:0 0 auto; }
}
@media(max-width:760px) {
    .desktop-widget { padding:10px; }
    .desktop-widget-value { font-size:21px; }
    .widget-center { padding:13px; }
    .widget-center-row { gap:8px; }
    .widget-center-row .widget-center-meta { overflow-wrap:anywhere; }
}
@media(max-width:430px) {
    .desktop-widget { width:min(205px, calc(100vw - 32px)); padding:9px; }
    .desktop-widget-value { font-size:19px; }
    .widget-center-row { flex-wrap:wrap; }
    .widget-center-row button { width:100%; }
}

.desktop-icon.selected {
    background: color-mix(in srgb, var(--accent) 28%, transparent);
    outline: 1px solid var(--accent);
}

.desktop-icon[draggable="true"] { cursor: grab; }

.desktop-context-menu {
    position: fixed;
    z-index: 20000;
    min-width: 210px;
    padding: 6px;
    background: #17243bf5;
    border: 1px solid #ffffff35;
    border-radius: 9px;
    box-shadow: 0 12px 35px #0009;
    backdrop-filter: blur(18px);
    display: none;
}

.desktop-context-menu button {
    display: block;
    width: 100%;
    padding: 10px 12px;
    color: white;
    text-align: left;
    background: transparent;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
}

.desktop-context-menu button:hover { background: #ffffff20; }
.desktop-context-menu .menu-separator {
    height: 1px;
    margin: 5px 3px;
    background: #ffffff25;
}

.desktop-icon {
    width: 90px;
    padding: 12px 5px;
    text-align: center;
    cursor: pointer;
    border-radius: 8px;
    display: inline-block;
    vertical-align: top;
}

.desktop-icon:hover {
    background: #ffffff25;
}

.desktop-icon .symbol {
    font-size: 35px;
}

.desktop-icon p {
    font-size: 13px;
    margin: 5px 0;
}

/* TASKBAR */

.taskbar {
    position: fixed;
    bottom: 0;
    width: 100%;
    height: 58px;
    background: #101a2de8;
    backdrop-filter: blur(20px);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    border-top: 3px solid var(--accent);
    z-index: 10000;
}

.task-button {
    border: none;
    background: transparent;
    color: white;
    width: 43px;
    height: 43px;
    border-radius: 9px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 5px;
}

.task-button img {
    width: 31px;
    height: 31px;
    display: block;
}

.task-button:hover,
.task-button.active {
    background: color-mix(in srgb, var(--accent) 35%, transparent);
}

.task-button.active::after {
    content: "";
    display: block;
    width: 15px;
    height: 3px;
    margin: 1px auto 0;
    background: var(--accent);
    border-radius: 5px;
}

.open-apps {
    display: flex;
    gap: 5px;
    align-items: center;
}

.taskbar-right {
    position: absolute;
    right: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.clock {
    font-size: 12px;
    text-align: right;
    cursor: pointer;
}

.notification-button {
    background: transparent;
    border: 0;
    font-size: 19px;
    cursor: pointer;
}

/* STARTMENÜ */

.start-menu {
    position: fixed;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    width: min(540px,95vw);
    max-height: 75vh;
    overflow-y: auto;
    padding: 24px;
    background: #17243bf5;
    backdrop-filter: blur(25px);
    border: 1px solid #ffffff30;
    border-radius: 14px;
    display: none;
    z-index: 9999;
    box-shadow: 0 15px 50px #0007;
}

.start-menu h2 {
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 12px;
}

.start-menu h2 img {
    width: 38px;
    height: 38px;
    filter: drop-shadow(0 0 10px #1685df88);
}

.search-box {
    width: 100%;
    padding: 12px;
    margin: 10px 0 18px;
    color: white;
    background: #071525;
    border: 1px solid #ffffff30;
    border-radius: 8px;
    outline: none;
}

.app-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 12px;
}

.app-item {
    background: #ffffff12;
    border: 0;
    color: white;
    border-radius: 9px;
    padding: 18px 5px;
    cursor: pointer;
    font-size: 14px;
}

.app-item:hover {
    background: #ffffff30;
}

.account-info {
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid #ffffff25;
    font-size: 13px;
    color: #c5d5e9;
}

#logoutButton {
    margin-top: 10px;
    padding: 9px 14px;
    background: #9b3434;
    border: 0;
    border-radius: 7px;
    cursor: pointer;
}

/* FENSTER */

.window {
    border-color: color-mix(in srgb, var(--accent) 65%, #ffffff35);
    position: absolute;
    top: 90px;
    left: 50%;
    transform: translateX(-50%);
    width: min(680px,90vw);
    height: min(470px,70vh);
    min-width: 280px;
    min-height: 190px;
    background: var(--panel);
    border: 1px solid #ffffff35;
    border-radius: 12px;
    box-shadow: 0 20px 70px #0008;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    resize: both;
}

.window.maximized {
    resize: none;
    border-radius: 0;
}

.titlebar {
    height: 42px;
    min-height: 42px;
    background: color-mix(in srgb, var(--accent) 38%, #17243b);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-left: 14px;
    cursor: grab;
}

.titlebar:active {
    cursor: grabbing;
}

.titlebar button {
    width: 43px;
    height: 42px;
    background: transparent;
    color: white;
    border: none;
    cursor: pointer;
}

.titlebar button:hover {
    background: #ffffff30;
}

.titlebar .close:hover {
    background: #d33;
}

.window-content {
    padding: 18px;
    overflow: auto;
    flex: 1;
}

/* THYQORA BROWSER */
.window-content:has(.thyqora-browser),
.window-content:has(.game-center) {
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 10px;
    overflow: hidden;
}
.thyqora-browser { display:flex; flex-direction:column; gap:8px; flex:1 1 auto; min-height:0; height:100%; }
.browser-toolbar { display:flex; flex:0 0 auto; gap:5px; align-items:center; flex-wrap:wrap; }
.browser-toolbar button { flex:0 0 auto; margin:0; min-width:38px; }
.browser-toolbar input { flex:1 1 180px; width:auto; max-width:none; min-width:90px; margin:0; }
.browser-view { position:relative; flex:1 1 auto; min-height:0; height:100%; background:#fff; border:1px solid #ffffff30; border-radius:8px; overflow:hidden; }
.browser-view iframe { width:100%; height:100%; min-height:100%; display:block; border:0; background:white; }
.browser-status { flex:0 0 auto; margin:0; min-height:18px; color:#a9bfd8; font-size:12px; }
.game-center { display:flex; flex:1 1 auto; flex-direction:column; gap:7px; height:100%; min-height:0; overflow:hidden; }
.game-presets { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(130px,1fr); grid-template-rows:1fr; gap:8px; overflow-x:auto; overflow-y:hidden; flex:0 0 auto; padding:2px 2px 7px; -webkit-overflow-scrolling:touch; }
@media(max-width:1024px) and (pointer:coarse) {
    .game-center { gap:9px; }
    .game-presets { grid-auto-columns:minmax(145px, 180px); }
    .game-stage { min-height:260px; }
    .game-tile { min-height:86px; max-height:none; }
}
@media(max-width:760px) {
    .game-stage { min-height:220px; }
    .game-help { line-height:1.4; }
}
.game-tile { display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:4px; min-height:78px; max-height:88px; padding:9px !important; margin:0 !important; text-align:left; background:#ffffff10 !important; }
.game-tile span { font-size:22px; }
.game-tile strong { font-size:13px; }
.game-tile small { color:#b9c8dd; font-size:10px; }
.game-stage { position:relative; display:flex; flex:1 1 0; flex-direction:column; min-height:0; overflow:auto; padding:8px; background:#07111f80; border:1px solid #ffffff20; border-radius:9px; }
.game-stage:has(.external-game-frame) { overflow:hidden; }
.game-stage-toolbar { display:flex; justify-content:flex-end; flex:0 0 auto; }
.game-stage-toolbar button { margin:0 0 4px !important; padding:7px 11px !important; }
.external-game-frame { display:block; flex:1 1 auto; width:100%; height:100%; min-height:0; border:0; border-radius:8px; background:#07111f; }
.fullscreen-exit-button { display:none; }
.game-stage:fullscreen .fullscreen-exit-button { display:block; position:absolute; top:14px; right:14px; z-index:20; margin:0 !important; padding:10px 15px !important; background:#b42332 !important; color:white; box-shadow:0 2px 12px #0009; }
.game-stage:fullscreen { width:100vw; height:100vh; max-height:100vh; padding:12px; border:0; border-radius:0; background:#07111f; }
.game-stage:fullscreen .external-game-frame { flex:1 1 auto; min-height:0; height:100%; }
.game-credit a { color:#70bdff; }
.builtin-game { display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; }
.builtin-game h3 { margin:2px 0; }
#snakeCanvas { width:min(360px,100%); height:auto; aspect-ratio:1; border:1px solid #ffffff40; border-radius:6px; image-rendering:pixelated; }
.snake-info { font-size:13px; }
.memory-grid { display:grid; grid-template-columns:repeat(4,minmax(48px,64px)); gap:7px; justify-content:center; }
.memory-card { width:100%; aspect-ratio:1; margin:0 !important; font-size:23px; font-weight:700; }
.memory-card.revealed { background:#1676c5 !important; }
.memory-card.matched { background:#237b52 !important; opacity:.8; }
.connect4-grid { display:grid; grid-template-columns:repeat(7,minmax(34px,48px)); gap:5px; padding:9px; background:#175ca8; border-radius:12px; }
.connect4-cell { width:100%; aspect-ratio:1; border-radius:50% !important; margin:0 !important; padding:0 !important; background:#dbeafe !important; color:#17243b !important; font-size:20px; }
.connect4-cell.red { background:#ef4444 !important; }
.connect4-cell.yellow { background:#facc15 !important; }
.reaction-pad { width:min(420px,100%); min-height:150px; border:0 !important; border-radius:14px !important; font-size:22px; font-weight:700; background:#334155 !important; touch-action:manipulation; }
.reaction-pad.ready { background:#16834b !important; }
.reaction-pad.waiting { background:#a83242 !important; }
.number2048-grid { display:grid; grid-template-columns:repeat(4,minmax(48px,72px)); gap:6px; padding:8px; background:#8b7967; border-radius:10px; }
.number2048-cell { display:grid; place-items:center; aspect-ratio:1; border-radius:7px; background:#d8cbbb; color:#263238; font-size:clamp(17px,3vw,25px); font-weight:800; }
.number2048-controls { display:grid; grid-template-columns:repeat(3,48px); gap:5px; justify-content:center; }
.number2048-controls button { margin:0 !important; padding:8px !important; }
.ttt-grid { display:grid; grid-template-columns:repeat(3,75px); gap:7px; }
.ttt-cell { width:75px; height:75px; margin:0 !important; font-size:30px; font-weight:700; }
.game-add-row { display:flex; gap:7px; flex-wrap:wrap; }
.game-add-row input { flex:1 1 180px; min-width:120px; margin:0; max-width:none; }
.game-list { display:flex; flex-wrap:wrap; gap:7px; max-height:100px; overflow:auto; }
.game-chip { display:flex; gap:5px; align-items:center; }
.game-frame-wrap { position:relative; flex:1; min-height:180px; background:#07111f; border:1px solid #ffffff30; border-radius:8px; overflow:hidden; }
.game-frame-wrap iframe { width:100%; height:100%; min-height:180px; display:block; border:0; background:#fff; }
.game-help { margin:0; color:#a9bfd8; font-size:12px; line-height:1.45; }


/* NEUE APPS 0.9 */
.calculator-app,.system-control-app,.weather-app { display:flex; flex-direction:column; gap:13px; max-width:100%; }
.calculator-heading,.weather-header { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.calculator-heading h2,.weather-header h2,.system-control-heading h2 { margin:0 0 4px; }
.calculator-heading p,.weather-header p,.system-control-heading p { margin:0; color:#a9bfd8; font-size:13px; }
.calculator-mode { color:#83c9ff; font-size:10px; letter-spacing:1px; border:1px solid #ffffff25; padding:6px 8px; border-radius:20px; }
.calculator-display { padding:13px; background:#050b12; border:1px solid #ffffff20; border-radius:10px; }
.calculator-display input { width:100%; max-width:100%; margin:0; padding:10px 4px; border:0; outline:0; background:transparent; color:white; font-size:22px; text-align:right; }
.calculator-display #calculatorResult { min-height:27px; color:#72d5ff; font-size:20px; font-weight:700; text-align:right; overflow-wrap:anywhere; }
.calculator-keys { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:7px; }
.calculator-keys button { min-width:0; min-height:43px; margin:0; padding:7px 3px; font-weight:600; background:#1b304d; }
.calculator-keys .calculator-special { background:#713b42; }
.calculator-keys .calculator-equals { background:var(--accent); }
.system-control-app { max-width:820px; }
.system-control-heading { margin-bottom:2px; }
.control-section { padding:13px; background:#ffffff0b; border:1px solid #ffffff20; border-radius:10px; }
.control-section h3 { margin:0 0 12px; font-size:14px; }
.control-accent-list,.control-wallpaper-list { display:flex; flex-wrap:wrap; gap:12px; }
.control-accent { width:34px; height:34px; min-width:34px; min-height:34px; margin:0 !important; padding:0 !important; border-radius:50% !important; background:var(--choice) !important; border:2px solid #ffffff55 !important; }
.control-accent.selected { outline:3px solid var(--choice); outline-offset:3px; }
.control-wallpaper { width:90px; height:55px; min-width:90px; min-height:55px; margin:0 !important; padding:0 !important; border:2px solid #ffffff55 !important; border-radius:8px !important; }
.control-wallpaper.selected { outline:3px solid var(--accent); outline-offset:2px; }
.control-volume-row { display:flex; align-items:center; gap:15px; }
.control-volume-row input { flex:1; min-width:80px; max-width:none; margin:0; accent-color:var(--accent); }
.control-volume-row strong { min-width:45px; text-align:right; }
.control-account { display:flex; flex-direction:column; gap:10px; }
.control-account h3 { margin-bottom:0; }
.control-account div { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid #ffffff15; font-size:13px; }
.control-account div span { color:#a9bfd8; }
.control-account button { align-self:flex-start; margin:0; background:#8d343c; }
.weather-search { display:flex; gap:7px; flex-wrap:wrap; }
.weather-search input { flex:1 1 180px; min-width:100px; max-width:none; margin:0; }
.weather-search button,.weather-header button { margin:0; }
.weather-status { min-height:20px; color:#a9bfd8; font-size:12px; }

<script>

/* =====================================
   GRUNDEINSTELLUNGEN UND DATEN
===================================== */

const DEFAULT_SETTINGS = {
    background: 1,
    accent: "#1685df",
    volume: 70
};

let settings = {...DEFAULT_SETTINGS};

let files = [
    {
        id: "folder-documents",
        name: "Dokumente",
        type: "folder",
        parent: "root",
        content: ""
    },
    {
        id: "folder-pictures",
        name: "Bilder",
        type: "folder",
        parent: "root",
        content: ""
    },
    {
        id: "folder-downloads",
        name: "Downloads",
        type: "folder",
        parent: "root",
        content: ""
    }
];

let trash = [];
let currentFolder = "root";
let currentUsername = "";
let cloudReady = false;
let saveQueue = Promise.resolve();

let notifications = [];

const wallpapers = {
    1: "linear-gradient(135deg,#173b70,#101b3c,#315d91)",
    2: "linear-gradient(135deg,#111827,#05070c)",
    3: "linear-gradient(135deg,#42206b,#111b46)",

    5: "linear-gradient(135deg,#14532d,#052e16)",

};

const apps = {
    monitor: {title:"Systemmonitor",icon:"📊"},
    taskmanager: {title:"Task-Manager",icon:"🗂️"},
    appcenter: {title:"App-Center",icon:"🛍️"},
    browser: {title:"Browser",icon:"🌐"},
    settings: {title:"Einstellungen",icon:"⚙️"},

    systemcontrol: {title:"Systemsteuerung",icon:"🛠️"},
    weather: {title:"Wetter",icon:"🌦️"}
};

// System-Apps bleiben immer installiert. Optionale Apps werden pro Konto gespeichert.
const CORE_APPS = ["taskmanager", "appcenter", "browser", "settings", "terminal"];
const APP_CATALOG = {
    monitor: {
        title: "Systemmonitor",
        icon: "📊",
        description: "Zeigt Browser-Auslastung, Speicher, Netzwerk und Sitzungsdaten."
    },
    about: {
        title: "Über THYQORA",
        icon: "💻",
        description: "Zeigt Informationen über THYQORA OS und dein Konto."
    },
    designcenter: {
        title: "Design-Center",
        icon: "🎨",
        description: "Passe Akzentfarben und Desktop-Hintergründe an."
    },
    gamecenter: {
        title: "Game-Center",
        icon: "🎮",
        description: "Füge Webspiele hinzu und spiele sie direkt in THYQORA OS."
    },
    calculator: {
        title: "Taschenrechner",
        icon: "🧮",
        description: "Rechnet Grundrechenarten und wissenschaftliche Funktionen."
    },
    systemcontrol: {
        title: "Systemsteuerung",
        icon: "🛠️",
        description: "Verwaltet Design, Anzeige, Lautstärke und Kontoeinstellungen zentral."
    },
    weather: {
        title: "Wetter",
        icon: "🌦️",
        description: "Aktuelles Wetter und eine 7-Tage-Vorhersage für deinen Ort."
    }
};
let installedApps = [...CORE_APPS];
let savedGames = [];
const DEFAULT_DESKTOP_SHORTCUTS = ["taskmanager", "appcenter", "browser", "settings", "terminal", "trash"];
let desktopShortcuts = [...DEFAULT_DESKTOP_SHORTCUTS];
let selectedDesktopApp = null;
const DEFAULT_DESKTOP_WIDGETS = ["clock", "date", "system"];
const WIDGET_CATALOG = {
    clock: {title:"Uhr", icon:"🕒", description:"Zeigt die aktuelle Uhrzeit."},
    date: {title:"Datum", icon:"📅", description:"Zeigt Wochentag und Datum."},
    system: {title:"Systemübersicht", icon:"💻", description:"Zeigt Browser- und Bildschirmdaten."},
    weather: {title:"Wetter", icon:"🌦️", description:"Zeigt das aktuelle Wetter für deinen gespeicherten Ort.", requiresApp:"weather"}
};
let desktopWidgets = [...DEFAULT_DESKTOP_WIDGETS];
let desktopWidgetPositions = {};
let widgetWeatherRequest = 0;

let windows = {};
let activeWindow = null;
let nextWindow = 1;
let zIndex = 100;


/* =====================================
   CLOUD-SPEICHER
===================================== */

async function cloudGetAll() {
    const response = await fetch("/api/data", {
        credentials: "same-origin"
    });

    if (!response.ok) {
        throw new Error("Cloud-Daten konnten nicht geladen werden.");
    }

    return await response.json();
}

async function cloudSave(key, value) {

    const response = await fetch("/api/data", {
        method: "POST",
        credentials: "same-origin",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            key,
            value
        })
    });

    if (!response.ok) {
        throw new Error("Cloud-Speicherung fehlgeschlagen.");
    }

    return await response.json();
}

function queueSave(key, value) {

    if (!cloudReady) return;

    // Speichert nacheinander, damit schnelle Änderungen
    // nicht versehentlich ältere Daten zuletzt speichern.
    saveQueue = saveQueue
        .then(() => cloudSave(key, value))
        .catch(error => {
            console.error("THYQORA Cloud:", error);
            notify("Cloud-Speicherung fehlgeschlagen", error.message);
        });

    return saveQueue;
}

async function saveSettings() {
    return queueSave("thyqoraSettings", settings);
}

async function saveFiles() {
    return queueSave("thyqoraFiles", files);
}

async function saveTrash() {
    return queueSave("thyqoraTrash", trash);
}

async function saveInstalledApps() {
    return queueSave("thyqoraInstalledApps", installedApps);
}

function saveDesktopShortcuts() {
    return queueSave("thyqoraDesktopShortcuts", desktopShortcuts);
}

function saveDesktopWidgets() {
    return queueSave("thyqoraDesktopWidgets", desktopWidgets);
}
function saveDesktopWidgetPositions() {
    return queueSave("thyqoraDesktopWidgetPositions", desktopWidgetPositions);
}

function isWidgetAvailable(id) {
    const widget = WIDGET_CATALOG[id];
    return !!widget && (!widget.requiresApp || isAppInstalled(widget.requiresApp));
}

function isAppInstalled(id) {
    return CORE_APPS.includes(id) || installedApps.includes(id);
}

async function installApp(id) {
    if (!Object.prototype.hasOwnProperty.call(APP_CATALOG, id)) return;
    if (isAppInstalled(id)) return;

    installedApps = [...installedApps, id];
    renderAppGrid(document.getElementById("appSearch")?.value || "");
    renderAppCenter();
    await saveInstalledApps();
    renderDesktop();
    notify("App installiert", APP_CATALOG[id].title + " wurde hinzugefügt.");
}

async function uninstallApp(id) {
    if (!Object.prototype.hasOwnProperty.call(APP_CATALOG, id)) return;
    if (!isAppInstalled(id)) return;

    if (windows[id]) closeWindow(id);
    installedApps = installedApps.filter(appId => appId !== id);
    if (id === "weather") {
        desktopWidgets = desktopWidgets.filter(widgetId => widgetId !== "weather");
        await saveDesktopWidgets();
    }
    renderAppGrid(document.getElementById("appSearch")?.value || "");
    renderAppCenter();
    renderDesktop();
    await saveInstalledApps();
    notify("App deinstalliert", APP_CATALOG[id].title + " wurde entfernt.");
}

async function loadCloudSettings() {

    cloudReady = false;

    try {
        const data = await cloudGetAll();

        function readValue(key) {
            const entry = data.find(item => item.key === key);

            if (!entry) return null;

            try {
                const parsed = JSON.parse(entry.value);
                // Unterstützt sowohl alte doppelt codierte Werte
                // als auch das korrigierte Speicherformat.
                if (typeof parsed === "string") {
                    try { return JSON.parse(parsed); } catch { return parsed; }
                }
                return parsed;
            } catch {
                return entry.value;
            }
        }

        const loadedSettings = readValue("thyqoraSettings");

        if (loadedSettings && typeof loadedSettings === "object") {
            settings = {
                ...DEFAULT_SETTINGS,
                ...loadedSettings
            };
        } else {
            // Alte THYQORA-Hintergrund-Einstellung übernehmen.
            const oldBackground = readValue("thyqoraBackground");

            if (oldBackground) {
                settings.background = Number(oldBackground);
            }
        }

        const loadedFiles = readValue("thyqoraFiles");

        if (Array.isArray(loadedFiles)) {
            files = loadedFiles;
        }

        const loadedTrash = readValue("thyqoraTrash");

        if (Array.isArray(loadedTrash)) {
            trash = loadedTrash;
        }

        const loadedApps = readValue("thyqoraInstalledApps");
        installedApps = Array.isArray(loadedApps)
            ? [...new Set([...CORE_APPS, ...loadedApps.filter(id => Object.prototype.hasOwnProperty.call(APP_CATALOG, id))])]
            : [...CORE_APPS];

        const loadedWeatherCity = readValue("thyqoraWeatherCity");
        if (typeof loadedWeatherCity === "string") weatherCity = loadedWeatherCity;

        const loadedGames = readValue("thyqoraGames");
        savedGames = Array.isArray(loadedGames)
            ? loadedGames.filter(game => game && typeof game.name === "string" && typeof game.url === "string" && game.url.startsWith("https://"))
            : [];

        const loadedShortcuts = readValue("thyqoraDesktopShortcuts");
        desktopShortcuts = Array.isArray(loadedShortcuts)
            ? [...new Set(loadedShortcuts.filter(id => id === "trash" || (apps[id] && isAppInstalled(id))))]
            : [...DEFAULT_DESKTOP_SHORTCUTS];

        const loadedWidgets = readValue("thyqoraDesktopWidgets");
        desktopWidgets = Array.isArray(loadedWidgets)
            ? [...new Set(loadedWidgets.filter(isWidgetAvailable))]
            : [...DEFAULT_DESKTOP_WIDGETS];

        const loadedWidgetPositions = readValue("thyqoraDesktopWidgetPositions");
        desktopWidgetPositions = loadedWidgetPositions && typeof loadedWidgetPositions === "object" && !Array.isArray(loadedWidgetPositions)
            ? loadedWidgetPositions
            : {};

        applySettings();
        renderDesktop();

        cloudReady = true;

        // Neue Standardwerte beim ersten Start speichern.
        await saveSettings();
        await saveFiles();
        await saveTrash();
        await saveInstalledApps();
        await saveDesktopShortcuts();
        await saveDesktopWidgets();
        await saveDesktopWidgetPositions();

        notify("Cloud geladen", "Deine THYQORA-Daten wurden geladen.");

    } catch (error) {
        console.error(error);

        cloudReady = false;

        notify(
            "Cloud nicht erreichbar",
            "Deine Änderungen können momentan nicht gespeichert werden."
        );
    }
}


/* =====================================
   AUTHENTICATOR UND BENUTZERKONTEN
===================================== */

let authMode = "login";
let authSetupPending = false;

const authUsername = document.getElementById("authUsername");
const authPassword = document.getElementById("authPassword");
const authMethod = document.getElementById("authMethod");
const inviteCode = document.getElementById("inviteCode");
const authCode = document.getElementById("authCode");
const authSetup = document.getElementById("authSetup");
const authSecret = document.getElementById("authSecret");
const authError = document.getElementById("authError");
const authSubmit = document.getElementById("authSubmit");

function setAuthMode(mode) {

    authMode = mode;
    authSetupPending = false;

    document.getElementById("authSubtitle").textContent =
        mode === "login"
            ? "Melde dich bei deinem THYQORA-Konto an."
            : "Erstelle dein persönliches THYQORA-Konto.";

    authSubmit.textContent =
        mode === "login" ? "Anmelden" : "Konto erstellen";

    document.getElementById("authSwitch").textContent =
        mode === "login"
            ? "Noch kein Konto? Registrieren"
            : "Du hast schon ein Konto? Anmelden";

    authPassword.autocomplete =
        mode === "login" ? "current-password" : "new-password";

    document.getElementById("authMethodContainer").style.display =
        mode === "register" ? "block" : "none";

    inviteCode.style.display = "none";
    authSetup.style.display = "none";
    authCode.style.display = "none";

    document.getElementById("authQr").innerHTML = "";

    inviteCode.value = "";
    authCode.value = "";
    authSecret.textContent = "";

    authError.textContent = "";
    authError.style.color = "#ff8585";
}

authMethod.addEventListener("change", () => {

    authSetupPending = false;

    authSetup.style.display = "none";
    authCode.style.display = "none";

    document.getElementById("authQr").innerHTML = "";

    inviteCode.style.display =
        authMethod.value === "invite" ? "block" : "none";

    authSubmit.textContent = "Konto erstellen";
    authError.textContent = "";
});

document.getElementById("authSwitch").addEventListener("click", () => {
    setAuthMode(authMode === "login" ? "register" : "login");
});

async function copyAuthSecret() {

    try {
        await navigator.clipboard.writeText(authSecret.textContent);

        authError.style.color = "#70ffad";
        authError.textContent = "Schlüssel kopiert.";

    } catch {
        authError.textContent =
            "Bitte markiere den Schlüssel und kopiere ihn manuell.";
    }
}

function createAuthenticatorQR(secret, username) {

    const container = document.getElementById("authQr");

    container.innerHTML = "";

    if (typeof QRCode === "undefined") {
        authError.textContent =
            "QR-Code-Bibliothek konnte nicht geladen werden. Nutze den Schlüssel manuell.";
        return;
    }

    const issuer = "THYQORA OS";

    const account = encodeURIComponent(issuer + ":" + username);

    const uri =
        "otpauth://totp/" + account +
        "?secret=" + encodeURIComponent(secret) +
        "&issuer=" + encodeURIComponent(issuer) +
        "&algorithm=SHA1" +
        "&digits=6" +
        "&period=30";

    new QRCode(container, {
        text: uri,
        width: 190,
        height: 190,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
    });
}

document.getElementById("authForm").addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        const username = authUsername.value.trim();
        const password = authPassword.value;

        authError.style.color = "#ff8585";
        authError.textContent = "";

        authSubmit.disabled = true;
        authSubmit.textContent = "Bitte warten ...";

        try {

            let response;
            let result;

            if (authMode === "login") {

                response = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: {"Content-Type":"application/json"},
                    credentials: "same-origin",
                    body: JSON.stringify({
                        username,
                        password,
                        code: authCode.value.trim()
                    })
                });

                result = await response.json();

                if (!response.ok) {

                    if (result.requiresAuthenticator) {
                        authCode.style.display = "block";
                        authCode.focus();

                        authError.textContent =
                            "Bitte gib deinen aktuellen Authenticator-Code ein.";

                        return;
                    }

                    throw new Error(
                        result.error || "Anmeldung fehlgeschlagen."
                    );
                }

                await enterDesktop(result.username);
                return;
            }

            if (
                authMethod.value === "authenticator" &&
                authSetupPending
            ) {

                response = await fetch("/api/auth/register/verify", {
                    method: "POST",
                    headers: {"Content-Type":"application/json"},
                    credentials: "same-origin",
                    body: JSON.stringify({
                        username,
                        code: authCode.value.trim()
                    })
                });

                result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.error || "Code konnte nicht bestätigt werden."
                    );
                }

                authSetupPending = false;

                await enterDesktop(result.username);
                return;
            }

            const method = authMethod.value;

            response = await fetch("/api/auth/register", {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                credentials: "same-origin",
                body: JSON.stringify({
                    username,
                    password,
                    method,
                    inviteCode: inviteCode.value
                })
            });

            result = await response.json();

            if (!response.ok) {
                throw new Error(
                    result.error || "Registrierung fehlgeschlagen."
                );
            }

            if (result.setupRequired) {

                authSetupPending = true;

                authSecret.textContent = result.secret;

                authSetup.style.display = "block";
                authCode.style.display = "block";

                createAuthenticatorQR(result.secret, username);

                authCode.value = "";
                authCode.focus();

                authSubmit.textContent = "Authenticator bestätigen";

                authError.textContent =
                    "Scanne den QR-Code und gib anschließend den Code ein.";

                return;
            }

            await enterDesktop(result.username);

        } catch (error) {

            authError.style.color = "#ff8585";
            authError.textContent = error.message;

        } finally {

            authSubmit.disabled = false;

            if (authMode === "login") {
                authSubmit.textContent = "Anmelden";
            } else if (authSetupPending) {
                authSubmit.textContent = "Authenticator bestätigen";
            } else {
                authSubmit.textContent = "Konto erstellen";
            }
        }
    }
);


/* =====================================
   LOGIN UND LOGOUT
===================================== */

async function enterDesktop(username) {

    currentUsername = username;

    document.body.classList.add("authenticated");

    document.getElementById("accountUsername").textContent = username;

    await loadCloudSettings();
}

async function checkLogin() {

    try {

        const response = await fetch("/api/auth/me", {
            credentials: "same-origin"
        });

        const result = await response.json();

        if (result.authenticated) {
            await enterDesktop(result.username);
        } else {
            document.body.classList.remove("authenticated");
        }

    } catch (error) {

        console.error(error);

        authError.textContent =
            "Verbindung zum THYQORA-Server fehlgeschlagen.";
    }
}

async function logout() {

    try {

        await fetch("/api/auth/logout", {
            method: "POST",
            credentials: "same-origin"
        });

    } catch (error) {
        console.error(error);

    } finally {

        Object.keys(windows).forEach(closeWindow);

        cloudReady = false;

        document.body.classList.remove("authenticated");

        document.getElementById("startMenu").style.display = "none";

        authPassword.value = "";
        authCode.value = "";
        inviteCode.value = "";

        setAuthMode("login");
    }
}

/* =====================================
   DATEIMANAGER
===================================== */

function escapeHTML(value) {

    return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[character]);
}

function createId() {

    if (crypto.randomUUID) {
        return crypto.randomUUID();
    }

    return Date.now().toString(36) +
        Math.random().toString(36).slice(2);
}

function getFolderName(id) {

    if (id === "root") return "Dieser PC";

    const folder = files.find(item =>
        item.id === id && item.type === "folder"
    );

    return folder ? folder.name : "Dieser PC";
}

function renderFiles() {

    const container = document.getElementById("fileList");

    if (!container) return;

    const items = files.filter(item =>
        item.parent === currentFolder
    );

    document.getElementById("fileBreadcrumb").textContent =
        "📁 " + getFolderName(currentFolder);

    container.innerHTML = "";

    if (currentFolder !== "root") {

        const back = document.createElement("div");

        back.className = "file-row";
        back.innerHTML = "<span>⬆️</span><span class='file-name'>Zurück</span>";

        back.onclick = () => {

            const current = files.find(item => item.id === currentFolder);

            currentFolder = current ? current.parent : "root";

            renderFiles();
        };

        container.appendChild(back);
    }

    if (items.length === 0) {

        const empty = document.createElement("div");

        empty.className = "empty-state";
        empty.textContent = "Dieser Ordner ist leer.";

        container.appendChild(empty);
    }

    items.forEach(item => {

        const row = document.createElement("div");

        row.className = "file-row";

        const icon = item.type === "folder" ? "📁" : "📄";

        row.innerHTML = `
            <span>${icon}</span>
            <span class="file-name">${escapeHTML(item.name)}</span>
            <button data-action="rename">Umbenennen</button>
            <button data-action="delete">Löschen</button>
        `;

        row.querySelector(".file-name").ondblclick = () => {

            if (item.type === "folder") {
                currentFolder = item.id;
                renderFiles();
            } else {
                editFile(item.id);
            }
        };

        row.querySelector('[data-action="rename"]').onclick = event => {
            event.stopPropagation();
            renameFile(item.id);
        };

        row.querySelector('[data-action="delete"]').onclick = event => {
            event.stopPropagation();
            deleteFile(item.id);
        };

        row.onclick = () => {
            if (item.type === "folder") {
                currentFolder = item.id;
                renderFiles();
            } else {
                editFile(item.id);
            }
        };

        container.appendChild(row);
    });
}

    setTimeout(renderFiles, 0);

        <div class="app-toolbar">
            <button onclick="createFolder()">＋ Ordner</button>

        </div>

        <div class="breadcrumb" id="fileBreadcrumb">Dieser PC</div>

function createFolder() {

    const name = prompt("Name des neuen Ordners:");

    if (!name || !name.trim()) return;

    files.push({
        id: createId(),
        name: name.trim(),
        type: "folder",
        parent: currentFolder,
        content: ""
    });

    saveFiles();
    renderFiles();
}

function createFile() {

    const name = prompt("Name der neuen Datei:", "Neue Datei.txt");

    if (!name || !name.trim()) return;

    files.push({
        id: createId(),
        name: name.trim(),
        type: "file",
        parent: currentFolder,
        content: ""
    });

    saveFiles();
    renderFiles();
}

function editFile(id) {

    const file = files.find(item => item.id === id);

    if (!file || file.type !== "file") return;

    const content = prompt(
        "Inhalt von " + file.name + ":",
        file.content || ""
    );

    if (content === null) return;

    file.content = content;

    saveFiles();

    notify("Datei gespeichert", file.name + " wurde in der Cloud gespeichert.");

    renderFiles();
}

function renameFile(id) {

    const file = files.find(item => item.id === id);

    if (!file) return;

    const name = prompt("Neuer Name:", file.name);

    if (!name || !name.trim()) return;

    file.name = name.trim();

    saveFiles();
    renderFiles();
}

function deleteFile(id) {

    const file = files.find(item => item.id === id);

    if (!file) return;

    if (!confirm('"' + file.name + '" in den Papierkorb verschieben?')) {
        return;
    }

    const ids = [id];

    // Unterordner ebenfalls in den Papierkorb verschieben.
    function collectChildren(parentId) {
        files.filter(item => item.parent === parentId).forEach(child => {
            ids.push(child.id);

            if (child.type === "folder") {
                collectChildren(child.id);
            }
        });
    }

    if (file.type === "folder") {
        collectChildren(id);
    }

    const moved = files.filter(item => ids.includes(item.id));

    moved.forEach(item => {
        item.originalParent = item.parent;
        item.parent = "trash";
    });

    trash.push(...moved);

    files = files.filter(item => !ids.includes(item.id));

    if (currentFolder === id) {
        currentFolder = "root";
    }

    saveFiles();
    saveTrash();
    renderFiles();

    notify("Papierkorb", file.name + " wurde verschoben.");
}


/* =====================================
   PAPIERKORB
===================================== */

function renderTrash() {

    const container = document.getElementById("trashList");

    if (!container) return;

    container.innerHTML = "";

    if (trash.length === 0) {

        container.innerHTML =
            '<div class="empty-state">Der Papierkorb ist leer.</div>';

        return;
    }

    trash.forEach(item => {

        const row = document.createElement("div");

        row.className = "file-row";

        row.innerHTML = `
            <span>${item.type === "folder" ? "📁" : "📄"}</span>
            <span class="file-name">${escapeHTML(item.name)}</span>
            <button data-action="restore">Wiederherstellen</button>
            <button data-action="remove">Endgültig löschen</button>
        `;

        row.querySelector('[data-action="restore"]').onclick = () => {
            restoreTrashItem(item.id);
        };

        row.querySelector('[data-action="remove"]').onclick = () => {
            permanentlyDelete(item.id);
        };

        container.appendChild(row);
    });
}

function trashContent() {

    setTimeout(renderTrash, 0);

    return `
        <h2>🗑️ Papierkorb</h2>

        <div class="app-toolbar">
            <button onclick="emptyTrash()">Papierkorb leeren</button>
        </div>

        <div id="trashList"></div>
    `;
}

function restoreTrashItem(id) {

    const item = trash.find(entry => entry.id === id);

    if (!item) return;

    const restoreIds = [id];

    function collectChildren(parentId) {
        trash.filter(entry => entry.parent === parentId).forEach(child => {
            restoreIds.push(child.id);

            if (child.type === "folder") {
                collectChildren(child.id);
            }
        });
    }

    if (item.type === "folder") {
        collectChildren(id);
    }

    const restored = trash.filter(entry => restoreIds.includes(entry.id));

    restored.forEach(entry => {

        const originalParent = entry.originalParent || "root";

        const parentStillExists =
            originalParent === "root" ||
            files.some(file =>
                file.id === originalParent && file.type === "folder"
            );

        entry.parent = parentStillExists ? originalParent : "root";

        delete entry.originalParent;

        files.push(entry);
    });

    trash = trash.filter(entry => !restoreIds.includes(entry.id));

    saveFiles();
    saveTrash();

    renderTrash();

    notify("Wiederhergestellt", item.name + " wurde wiederhergestellt.");
}

function permanentlyDelete(id) {

    const item = trash.find(entry => entry.id === id);

    if (!item) return;

    if (!confirm('"' + item.name + '" endgültig löschen?')) return;

    const ids = [id];

    function collectChildren(parentId) {
        trash.filter(entry => entry.parent === parentId).forEach(child => {
            ids.push(child.id);

            if (child.type === "folder") {
                collectChildren(child.id);
            }
        });
    }

    if (item.type === "folder") {
        collectChildren(id);
    }

    trash = trash.filter(entry => !ids.includes(entry.id));

    saveTrash();
    renderTrash();

    notify("Gelöscht", item.name + " wurde endgültig gelöscht.");
}

function emptyTrash() {

    if (trash.length === 0) return;

    if (!confirm("Möchtest du den gesamten Papierkorb leeren?")) return;

    trash = [];

    saveTrash();
    renderTrash();

    notify("Papierkorb geleert", "Alle Einträge wurden entfernt.");
}

function toggleGameFullscreen() {

function startSnake() {
    if (snakeTimer) clearInterval(snakeTimer);
    snakeState = {
        body: [{x:10,y:10},{x:9,y:10},{x:8,y:10}],
        direction: {x:1,y:0},
        next: {x:1,y:0},
        food: {x:15,y:10},
        score: 0,
        over: false
    };
    const status = document.getElementById("snakeStatus");
    if (status) status.textContent = "Läuft! Nutze die Pfeiltasten.";
    document.onkeydown = event => {
        if (!snakeState || snakeState.over) return;
        const dirs = {
            ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1},
            ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0}
        };
        const next = dirs[event.key];
        if (!next) return;
        event.preventDefault();
        if (next.x !== -snakeState.direction.x || next.y !== -snakeState.direction.y) {
            snakeState.next = next;
        }
    };
    drawSnake();
    snakeTimer = setInterval(stepSnake, 125);
}

function stepSnake() {
    if (!snakeState || snakeState.over) return;
    const game = snakeState;
    game.direction = game.next;
    const head = {x:game.body[0].x + game.direction.x, y:game.body[0].y + game.direction.y};
    const ate = head.x === game.food.x && head.y === game.food.y;
    const collisionBody = ate ? game.body : game.body.slice(0, -1);
    if (head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20 ||
        collisionBody.some(part => part.x === head.x && part.y === head.y)) {
        game.over = true;
        clearInterval(snakeTimer);
        snakeTimer = null;
        const status = document.getElementById("snakeStatus");
        if (status) status.textContent = "Spiel vorbei! Punkte: " + game.score + ". Drücke Neu starten.";
        addFullscreenExitButton(stage);
        return;
    }
    game.body.unshift(head);
    if (ate) {
        game.score++;
        do {
            game.food = {x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};
        } while (game.body.some(part => part.x === game.food.x && part.y === game.food.y));
        const score = document.getElementById("snakeScore");
        if (score) score.textContent = game.score;
    } else {
        game.body.pop();
    }
    drawSnake();
}

function drawSnake() {
    const canvas = document.getElementById("snakeCanvas");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#07111f";
    ctx.fillRect(0,0,360,360);
    if (!snakeState) return;
    ctx.fillStyle = "#ef5555";
    ctx.fillRect(snakeState.food.x*18+2,snakeState.food.y*18+2,14,14);
    snakeState.body.forEach((part,index) => {
        ctx.fillStyle = index === 0 ? "#8be36b" : "#39a852";
        ctx.fillRect(part.x*18+1,part.y*18+1,16,16);
    });
}

document.addEventListener("keydown", event => {
    if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(event.key) &&
        document.getElementById("snakeCanvas")) {
        event.preventDefault();
    }
});

let lastCalculatorAnswer = 0;

function calculatorContent() {
    const keys = [
        ["C","clear"],["⌫","back"],["(","("],[")",")"],["÷","/"],
        ["sin","sin("],["cos","cos("],["tan","tan("],["√","sqrt("],["×","*"],
        ["7","7"],["8","8"],["9","9"],["^","^"],["−","-"],
        ["4","4"],["5","5"],["6","6"],["%","%"],["+","+"],

    ];
    return "<div class='calculator-app'>" +
        "<div class='calculator-heading'><div><h2>🧮 Taschenrechner</h2><p>Grundrechenarten und wissenschaftliche Funktionen</p></div><span class='calculator-mode'>WISSENSCHAFTLICH</span></div>" +
        "<div class='calculator-display'><input id='calculatorInput' type='text' inputmode='decimal' autocomplete='off' placeholder='Ausdruck eingeben' aria-label='Rechenausdruck' onkeydown='calculatorKeydown(event)'><div id='calculatorResult' aria-live='polite'>Bereit</div></div>" +
        "<div class='calculator-keys'>" + keys.map(([label,value]) => "<button type='button' class='" + (value === "equals" ? "calculator-equals" : ["clear","back"].includes(value) ? "calculator-special" : "") + "' onclick=\"calculatorPress('" + value + "')\">" + label + "</button>").join("") + "</div>" +
        "<p class='monitor-note'>Trigonometrische Funktionen verwenden Grad. Unterstützt: sin, cos, tan, √, ln, log, π, e, Klammern und Potenzen.</p></div>";
}

function calculateExpression(source) {
    const compact = String(source).replace(/\s+/g, "").replace(/,/g, ".");
    if (!compact) throw new Error("Bitte gib eine Rechnung ein.");
    const tokens = compact.match(/(?:\d+(?:\.\d*)?|\.\d+)|[a-zA-Z]+|[+\-*/^()%]/g) || [];
    if (tokens.join("") !== compact) throw new Error("Ungültiges Zeichen im Ausdruck.");
    let position = 0;
    const peek = () => tokens[position];
    const take = () => tokens[position++];

    function primary() {
        const token = take();
        if (token === undefined) throw new Error("Unvollständiger Ausdruck.");
        let value;
        if (token === "(") {
            value = expression();
            if (take() !== ")") throw new Error("Schließende Klammer fehlt.");
        } else if (/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(token)) {
            value = Number(token);
        } else if (/^[a-zA-Z]+$/.test(token)) {
            const name = token.toLowerCase();
            if (name === "pi") value = Math.PI;
            else if (name === "e") value = Math.E;
            else if (name === "ans") value = lastCalculatorAnswer;
            else {
                if (take() !== "(") throw new Error("Nach " + name + " wird eine Klammer erwartet.");
                const argument = expression();
                if (take() !== ")") throw new Error("Schließende Funktionsklammer fehlt.");
                const functions = {
                    sin: n => Math.sin(n * Math.PI / 180),
                    cos: n => Math.cos(n * Math.PI / 180),
                    tan: n => Math.tan(n * Math.PI / 180),
                    sqrt: n => Math.sqrt(n),
                    abs: n => Math.abs(n),
                    ln: n => Math.log(n),
                    log: n => Math.log10(n),
                    round: n => Math.round(n),
                    floor: n => Math.floor(n),
                    ceil: n => Math.ceil(n)
                };
                if (!functions[name]) throw new Error("Unbekannte Funktion: " + name);
                value = functions[name](argument);
            }
        } else {
            throw new Error("Unerwartetes Zeichen: " + token);
        }
        while (peek() === "%") { take(); value /= 100; }
        return value;
    }

    function power() {
        const left = primary();
        if (peek() === "^") { take(); return Math.pow(left, unary()); }
        return left;
    }
    function unary() {
        if (peek() === "+") { take(); return unary(); }
        if (peek() === "-") { take(); return -unary(); }
        return power();
    }
    function term() {
        let value = unary();
        while (peek() === "*" || peek() === "/") {
            const operator = take();
            const right = unary();
            value = operator === "*" ? value * right : value / right;
        }
        return value;
    }
    function expression() {
        let value = term();
        while (peek() === "+" || peek() === "-") {
            const operator = take();
            const right = term();
            value = operator === "+" ? value + right : value - right;
        }
        return value;
    }

    const result = expression();
    if (position !== tokens.length) throw new Error("Der Ausdruck konnte nicht vollständig gelesen werden.");
    if (!Number.isFinite(result)) throw new Error("Das Ergebnis ist nicht definiert.");
    return result;
}

function calculatorPress(value) {
    const input = document.getElementById("calculatorInput");
    const output = document.getElementById("calculatorResult");
    if (!input || !output) return;
    if (value === "clear") { input.value = ""; output.textContent = "Bereit"; return; }
    if (value === "back") { input.value = input.value.slice(0, -1); input.focus(); return; }
    if (value === "equals") {
        try {
            const result = calculateExpression(input.value);
            lastCalculatorAnswer = result;
            output.textContent = Number(result.toPrecision(12)).toLocaleString("de-DE", {maximumFractionDigits:10});
        } catch (error) { output.textContent = error.message; }
        return;
    }
    if (output.textContent !== "Bereit" && !Number.isFinite(Number(output.textContent.replace(",", ".")))) output.textContent = "Bereit";
    input.value += value;
    input.focus();
}
function calculatorKeydown(event) {
    if (event.key === "Enter" || event.key === "=") { event.preventDefault(); calculatorPress("equals"); }
    else if (event.key === "Escape") { event.preventDefault(); calculatorPress("clear"); }
}

    return "<div class='weather-app'>" +
        "<div class='weather-header'><div><h2>🌦️ Wetter</h2><p>Wettervorhersage für deinen Ort</p></div><button type='button' onclick='loadWeatherForecast()'>⟳ Aktualisieren</button></div>" +
        "<form class='weather-search' onsubmit='event.preventDefault(); loadWeatherForecast(true)'><input id='weatherCityInput' type='text' maxlength='80' placeholder='Stadt eingeben, z. B. Saarbrücken' value='" + escapeHTML(weatherCity) + "' autocomplete='off'><button type='submit'>Suchen</button></form>" +
        "<div id='weatherStatus' class='weather-status' aria-live='polite'>Gib einen Ort ein, um das Wetter abzurufen.</div><div id='weatherResult'></div>" +
        "<p class='monitor-note weather-credit'>Wetterdaten: Open-Meteo · Für die Vorhersage wird eine Internetverbindung benötigt.</p></div>";
}

function weatherDescription(code) {
    const descriptions = {
        0:["Sonnig","☀️"],1:["Überwiegend sonnig","🌤️"],2:["Teilweise bewölkt","⛅"],3:["Bewölkt","☁️"],
        45:["Neblig","🌫️"],48:["Nebel mit Reif","🌫️"],51:["Leichter Nieselregen","🌦️"],53:["Nieselregen","🌦️"],55:["Starker Nieselregen","🌧️"],
        56:["Gefrierender Nieselregen","🌧️"],57:["Starker gefrierender Nieselregen","🌧️"],61:["Leichter Regen","🌧️"],63:["Regen","🌧️"],65:["Starker Regen","🌧️"],
        66:["Gefrierender Regen","🌧️"],67:["Starker gefrierender Regen","🌧️"],71:["Leichter Schneefall","🌨️"],73:["Schneefall","🌨️"],75:["Starker Schneefall","❄️"],
        77:["Schneegriesel","🌨️"],80:["Regenschauer","🌦️"],81:["Regenschauer","🌧️"],82:["Starke Regenschauer","⛈️"],85:["Schneeschauer","🌨️"],86:["Starke Schneeschauer","❄️"],
        95:["Gewitter","⛈️"],96:["Gewitter mit Hagel","⛈️"],99:["Starkes Gewitter mit Hagel","⛈️"]
    };
    return descriptions[code] || ["Unbekannt","🌡️"];
}

async function loadWeatherForecast(saveCity = false) {
    const input = document.getElementById("weatherCityInput");
    const status = document.getElementById("weatherStatus");
    const result = document.getElementById("weatherResult");
    if (!status || !result) return;
    const city = (input ? input.value : weatherCity).trim();
    if (!city) { status.textContent = "Bitte gib zuerst eine Stadt ein."; result.innerHTML = ""; return; }

    const requestNumber = ++weatherRequestNumber;
    status.textContent = "Wetterdaten für " + city + " werden geladen …";
    result.innerHTML = "";

    try {
        const geoResponse = await fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(city) + "&count=1&language=de&format=json");
        if (!geoResponse.ok) throw new Error("Der Ortsdienst ist gerade nicht erreichbar.");
        const geoData = await geoResponse.json();
        const place = geoData.results && geoData.results[0];
        if (!place) throw new Error("Der Ort wurde nicht gefunden. Prüfe die Schreibweise.");

        const params = new URLSearchParams({
            latitude: place.latitude,
            longitude: place.longitude,
            current: "temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m",
            daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max",
            timezone: "auto",
            forecast_days: "7"
        });
        const forecastResponse = await fetch("https://api.open-meteo.com/v1/forecast?" + params.toString());
        if (!forecastResponse.ok) throw new Error("Die Wettervorhersage konnte nicht geladen werden.");
        const data = await forecastResponse.json();
        if (requestNumber !== weatherRequestNumber) return;

        weatherCity = place.name + (place.admin1 ? ", " + place.admin1 : "");
        if (saveCity) queueSave("thyqoraWeatherCity", weatherCity);
        if (desktopWidgets.includes("weather")) loadDesktopWeatherWidget();

        const current = data.current;
        const description = weatherDescription(current.weather_code);
        const unit = data.current_units?.temperature_2m || "°C";
        const windUnit = data.current_units?.wind_speed_10m || "km/h";
        const days = data.daily.time.map((date,index) => {
            const dayWeather = weatherDescription(data.daily.weather_code[index]);
            const dayName = new Date(date + "T12:00:00").toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"});
            return "<div class='weather-day'><span class='weather-day-name'>" + dayName + "</span><span class='weather-day-icon'>" + dayWeather[1] + "</span><span>" + Math.round(data.daily.temperature_2m_max[index]) + "° / " + Math.round(data.daily.temperature_2m_min[index]) + "°</span><small>" + (data.daily.precipitation_probability_max?.[index] ?? 0) + "% Regen</small></div>";
        }).join("");

        result.innerHTML = "<div class='weather-current'><div class='weather-place'>" + escapeHTML(weatherCity) + "</div><div class='weather-main'><span class='weather-icon'>" + description[1] + "</span><strong>" + Math.round(current.temperature_2m) + unit + "</strong></div><div class='weather-description'>" + description[0] + "</div><div class='weather-details'>" +
            "<div><small>Gefühlt</small><strong>" + Math.round(current.apparent_temperature) + unit + "</strong></div>" +
            "<div><small>Luftfeuchtigkeit</small><strong>" + current.relative_humidity_2m + "%</strong></div>" +
            "<div><small>Wind</small><strong>" + Math.round(current.wind_speed_10m) + " " + windUnit + "</strong></div>" +
            "<div><small>Niederschlag</small><strong>" + current.precipitation + " mm</strong></div></div></div>" +
            "<h3 class='weather-forecast-title'>7-Tage-Vorhersage</h3><div class='weather-days'>" + days + "</div>";

        status.textContent = "Zuletzt aktualisiert: " + new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
        if (input) input.value = weatherCity;
    } catch (error) {
        if (requestNumber !== weatherRequestNumber) return;
        status.textContent = error.message || "Wetterdaten konnten nicht geladen werden.";
        result.innerHTML = "";
    }
}

function openApp(app) {

    document.getElementById("startMenu").style.display = "none";

    if (!apps[app] || !isAppInstalled(app)) {
        notify("App nicht installiert", "Installiere diese App zuerst im App-Center.");
        return;
    }

    if (windows[app]) {
        restoreWindow(app);
        return;
    }

    const id = "window" + nextWindow++;

    const win = document.createElement("div");

    win.className = "window";
    win.id = id;

    win.innerHTML = `
        <div class="titlebar">

            <span>${apps[app].icon} ${apps[app].title}</span>

            <div>
                <button data-action="minimize">—</button>
                <button data-action="maximize">□</button>
                <button class="close" data-action="close">×</button>
            </div>

        </div>

        <div class="window-content">
            ${getAppContent(app)}
        </div>
    `;

    document.body.appendChild(win);

    windows[app] = {
        element: win,
        minimized: false,
        maximized: false,
        previous: null
    };

    win.querySelector('[data-action="minimize"]').onclick =
        () => minimizeWindow(app);

    win.querySelector('[data-action="maximize"]').onclick =
        () => maximizeWindow(app);

    win.querySelector('[data-action="close"]').onclick =
        () => closeWindow(app);

    win.addEventListener("pointerdown", () => focusWindow(app));

    makeDraggable(win, app);

    createTaskButton(app);

    focusWindow(app);
}

function createTaskButton(app) {

    const button = document.createElement("button");

    button.className = "task-button";
    button.id = "task-" + app;
    button.title = apps[app].title;
    button.textContent = apps[app].icon;

    button.onclick = () => {

        if (!windows[app]) return;

        if (windows[app].minimized) {
            restoreWindow(app);
        } else if (activeWindow === app) {
            minimizeWindow(app);
        } else {
            focusWindow(app);
        }
    };

    document.getElementById("openApps").appendChild(button);
}

function focusWindow(app) {

    const data = windows[app];

    if (!data || data.minimized) return;

    activeWindow = app;

    data.element.style.zIndex = ++zIndex;

    updateTaskbar();
}

function updateTaskbar() {

    Object.keys(windows).forEach(app => {

        const button = document.getElementById("task-" + app);

        if (!button) return;

        button.classList.toggle(
            "active",
            app === activeWindow && !windows[app].minimized
        );
    });
}

function minimizeWindow(app) {

    const data = windows[app];

    if (!data) return;

    data.element.style.display = "none";
    data.minimized = true;

    if (activeWindow === app) activeWindow = null;

    updateTaskbar();
}

function restoreWindow(app) {

    const data = windows[app];

    if (!data) return;

    data.element.style.display = "flex";
    data.minimized = false;

    focusWindow(app);
}

function closeWindow(app) {

    const data = windows[app];

    if (!data) return;

    data.element.remove();

    delete windows[app];

    document.getElementById("task-" + app)?.remove();

    if (activeWindow === app) {
        activeWindow = null;

        const remaining = Object.keys(windows)
            .filter(name => !windows[name].minimized);

        if (remaining.length) {
            focusWindow(remaining[remaining.length - 1]);
        }
    }

    updateTaskbar();
}

function maximizeWindow(app) {

    const data = windows[app];

    if (!data) return;

    const win = data.element;

    if (!data.maximized) {

        data.previous = {
            top: win.style.top,
            left: win.style.left,
            width: win.style.width,
            height: win.style.height,
            transform: win.style.transform
        };

        win.classList.add("maximized");

        win.style.top = "0";
        win.style.left = "0";
        win.style.width = "100vw";
        win.style.height = "calc(100vh - 58px)";
        win.style.transform = "none";

        data.maximized = true;

    } else {

        win.classList.remove("maximized");

        win.style.top = data.previous.top;
        win.style.left = data.previous.left;
        win.style.width = data.previous.width;
        win.style.height = data.previous.height;
        win.style.transform = data.previous.transform;

        data.maximized = false;
    }

    focusWindow(app);
}

function makeDraggable(win, app) {

    const bar = win.querySelector(".titlebar");

    let dragging = false;
    let offsetX = 0;
    let offsetY = 0;

    bar.addEventListener("pointerdown", event => {

        if (event.target.tagName === "BUTTON") return;

        const data = windows[app];

        if (!data || data.maximized) return;

        dragging = true;

        focusWindow(app);

        const rect = win.getBoundingClientRect();

        offsetX = event.clientX - rect.left;
        offsetY = event.clientY - rect.top;

        win.style.transform = "none";

        bar.setPointerCapture(event.pointerId);
    });

    bar.addEventListener("pointermove", event => {

        if (!dragging) return;

        win.style.left = (event.clientX - offsetX) + "px";
        win.style.top = Math.max(0, event.clientY - offsetY) + "px";
    });

    bar.addEventListener("pointerup", () => {
        dragging = false;
    });

    bar.addEventListener("pointercancel", () => {
        dragging = false;
    });

    bar.addEventListener("dblclick", event => {

        if (event.target.tagName === "BUTTON") return;

        maximizeWindow(app);
    });
}

    const grid = document.getElementById("appGrid");

    grid.innerHTML = "";

    Object.entries(apps).filter(([id]) => isAppInstalled(id)).forEach(([id, app]) => {
