function renderDesktop() {
    const desktop = document.getElementById("desktop");
    if (!desktop) return;
    desktop.innerHTML = "";

    desktopShortcuts = desktopShortcuts.filter(id =>
        id === "trash" || (apps[id] && isAppInstalled(id))
    );

    desktopShortcuts.forEach(id => {
        const isTrash = id === "trash";
        const app = isTrash
            ? { title: "Papierkorb", icon: "🗑️" }
            : apps[id];
        if (!app) return;

        const icon = document.createElement("div");
        icon.className = "desktop-icon";
        icon.dataset.appId = id;
        icon.draggable = true;
        icon.innerHTML = '<div class="symbol"></div><p></p>';
        icon.querySelector(".symbol").textContent = app.icon;
        icon.querySelector("p").textContent = app.title;

        icon.addEventListener("click", event => {
            event.stopPropagation();
            selectedDesktopApp = id;
            hideDesktopMenu();
        });
        icon.addEventListener("dblclick", event => {
            event.stopPropagation();
            if (id === "trash") openApp("trash");
            else openApp(id);
        });
        icon.addEventListener("contextmenu", event => {
            event.preventDefault();
            event.stopPropagation();
            showDesktopMenu(event.clientX, event.clientY, id);
        });
        icon.addEventListener("dragstart", event => {
            event.dataTransfer.setData("text/plain", id);
            event.dataTransfer.effectAllowed = "move";
        });
        desktop.appendChild(icon);
    });

    renderDesktopWidgets();
}

function renderDesktopWidgets() {
    const desktop = document.getElementById("desktop");
    if (!desktop) return;

    const layer = document.createElement("div");
    layer.className = "desktop-widget-layer";
    layer.id = "desktopWidgetLayer";
    desktop.appendChild(layer);

    desktopWidgets = desktopWidgets.filter(isWidgetAvailable);
    const narrowLayout = window.matchMedia("(max-width: 760px)").matches;

    desktopWidgets.forEach((id, index) => {
        const widget = WIDGET_CATALOG[id];
        if (!widget) return;
        const card = document.createElement("section");
        card.className = "desktop-widget";
        card.dataset.widgetId = id;

        let body = "";
        if (id === "clock") body = "<div class='desktop-widget-value' data-widget-clock>--:--:--</div><div class='desktop-widget-sub'>THYQORA OS</div>";
        else if (id === "date") body = "<div class='desktop-widget-value' data-widget-date>--</div><div class='desktop-widget-sub'>Kalenderdatum</div>";
        else if (id === "system") body = "<div class='desktop-widget-value'>" + (navigator.hardwareConcurrency || "–") + " Kerne</div><div class='desktop-widget-sub'>" + screen.width + " × " + screen.height + " · " + (navigator.onLine ? "Online" : "Offline") + "</div>";
        else if (id === "weather") body = "<div class='desktop-widget-weather'><span class='weather-icon' data-widget-weather-icon>🌦️</span><div><strong data-widget-weather-temp>--°</strong><div class='desktop-widget-sub' data-widget-weather-place>" + (weatherCity ? escapeHTML(weatherCity) : "Ort in Wetter-App festlegen") + "</div></div></div><div class='desktop-widget-sub' data-widget-weather-description>Wetter wird geladen …</div>";

        card.innerHTML = "<button class='desktop-widget-remove' type='button' title='Widget entfernen' aria-label='Widget entfernen'>×</button><h3 title='Zum Verschieben ziehen'>⠿ " + widget.icon + " " + widget.title + "</h3>" + body;
        card.querySelector(".desktop-widget-remove").addEventListener("click", () => removeDesktopWidget(id));
        layer.appendChild(card);

        const maxLeft = Math.max(0, layer.clientWidth - card.offsetWidth - 12);
        const maxTop = Math.max(0, layer.clientHeight - card.offsetHeight - 76);
        const saved = desktopWidgetPositions[id];
        let left = saved && Number.isFinite(saved.x) ? Math.max(8, Math.min(maxLeft, saved.x * maxLeft)) : (narrowLayout ? maxLeft : Math.max(8, maxLeft - (index % 2) * 255));
        let top = saved && Number.isFinite(saved.y) ? Math.max(8, Math.min(maxTop, saved.y * maxTop)) : (narrowLayout ? 12 + index * 108 : 16 + Math.floor(index / 2) * 108);
        top = Math.min(top, maxTop);
        card.style.left = left + "px";
        card.style.top = top + "px";
        if (!saved) desktopWidgetPositions[id] = {x:maxLeft ? left/maxLeft : 0, y:maxTop ? top/maxTop : 0};

        const handle = card.querySelector("h3");
        handle.style.touchAction = "none";
        handle.style.cursor = "grab";
        handle.addEventListener("pointerdown", event => {
            if (event.button !== undefined && event.button !== 0) return;
            event.preventDefault();
            const x0=event.clientX, y0=event.clientY, left0=card.offsetLeft, top0=card.offsetTop;
            handle.setPointerCapture?.(event.pointerId);
            handle.style.cursor="grabbing";
            const move=e=>{
                card.style.left=Math.max(8,Math.min(layer.clientWidth-card.offsetWidth-8,left0+e.clientX-x0))+"px";
                card.style.top=Math.max(8,Math.min(layer.clientHeight-card.offsetHeight-76,top0+e.clientY-y0))+"px";
            };
            const finish=()=>{
                handle.removeEventListener("pointermove",move);
                handle.removeEventListener("pointerup",finish);
                handle.removeEventListener("pointercancel",finish);
                handle.style.cursor="grab";
                const mx=Math.max(1,layer.clientWidth-card.offsetWidth-12), my=Math.max(1,layer.clientHeight-card.offsetHeight-76);
                desktopWidgetPositions[id]={x:Math.max(0,Math.min(1,card.offsetLeft/mx)),y:Math.max(0,Math.min(1,card.offsetTop/my))};
                saveDesktopWidgetPositions();
            };
            handle.addEventListener("pointermove",move);
            handle.addEventListener("pointerup",finish);
            handle.addEventListener("pointercancel",finish);
        });
    });

    const center = document.createElement("div");
    center.className = "widget-center";
    center.id = "widgetCenter";
    center.innerHTML = "<h3>▦ Desktop-Widgets</h3><p>Füge Widgets hinzu oder entferne sie. Ziehe sie am Titel mit Maus oder Finger an die gewünschte Stelle.</p><div class='widget-center-list' id='widgetCenterList'></div>";
    desktop.appendChild(center);
    renderWidgetCenterList();
    updateDesktopWidgetClock();
    if (desktopWidgets.includes("weather")) loadDesktopWeatherWidget();
}
function renderWidgetCenterList() {
    const list = document.getElementById("widgetCenterList");
    if (!list) return;
    list.innerHTML = "";
    Object.entries(WIDGET_CATALOG).forEach(([id, widget]) => {
        const available = isWidgetAvailable(id);
        const active = desktopWidgets.includes(id);
        const row = document.createElement("div");
        row.className = "widget-center-row";
        row.innerHTML = "<div class='widget-center-meta'><strong>" + widget.icon + " " + widget.title + "</strong><small>" + widget.description + (widget.requiresApp && !available ? " · Wetter-App benötigt" : "") + "</small></div><button type='button' " + (!available || active ? "disabled" : "") + ">" + (active ? "Hinzugefügt" : "Hinzufügen") + "</button>";
        row.querySelector("button").addEventListener("click", () => addDesktopWidget(id));
        list.appendChild(row);
    });
}

function toggleWidgetCenter() {
    const center = document.getElementById("widgetCenter");
    if (!center) return;
    const open = center.style.display !== "block";
    closeFloatingMenus(open ? "widgets" : "");
    center.style.display = open ? "block" : "none";
    if (open) renderWidgetCenterList();
}

function addDesktopWidget(id) {
    if (!isWidgetAvailable(id)) {
        notify("Widget nicht verfügbar", "Für das Wetter-Widget muss die Wetter-App installiert sein.");
        return;
    }
    if (desktopWidgets.includes(id)) return;
    desktopWidgets.push(id);
    renderDesktop();
    saveDesktopWidgets();
    const center = document.getElementById("widgetCenter");
    if (center) center.style.display = "block";
    notify("Widget hinzugefügt", WIDGET_CATALOG[id].title + " wurde auf dem Desktop hinzugefügt.");
}

function removeDesktopWidget(id) {
    desktopWidgets = desktopWidgets.filter(widgetId => widgetId !== id);
    renderDesktop();
    saveDesktopWidgets();
}

function moveDesktopWidget(draggedId, targetId) {
    const from = desktopWidgets.indexOf(draggedId);
    const to = desktopWidgets.indexOf(targetId);
    if (from < 0 || to < 0 || from === to) return;
    desktopWidgets.splice(from, 1);
    desktopWidgets.splice(to, 0, draggedId);
    renderDesktop();
    saveDesktopWidgets();
}

function updateDesktopWidgetClock() {
    const now = new Date();
    const clock = document.querySelector("[data-widget-clock]");
    const date = document.querySelector("[data-widget-date]");
    if (clock) clock.textContent = now.toLocaleTimeString("de-DE");
    if (date) date.textContent = now.toLocaleDateString("de-DE", {weekday:"long", day:"2-digit", month:"long"});
}

async function loadDesktopWeatherWidget() {
    const temp = document.querySelector("[data-widget-weather-temp]");
    const icon = document.querySelector("[data-widget-weather-icon]");
    const placeLabel = document.querySelector("[data-widget-weather-place]");
    const descriptionLabel = document.querySelector("[data-widget-weather-description]");
    if (!temp || !icon || !placeLabel || !descriptionLabel || !isAppInstalled("weather")) return;
    if (!weatherCity) {
        temp.textContent = "—";
        placeLabel.textContent = "Ort festlegen";
        descriptionLabel.textContent = "Öffne die Wetter-App und suche eine Stadt.";
        return;
    }

    const request = ++widgetWeatherRequest;
    descriptionLabel.textContent = "Wetter wird geladen …";
    try {
        const geoResponse = await fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(weatherCity) + "&count=1&language=de&format=json");
        if (!geoResponse.ok) throw new Error("Wetterdaten nicht erreichbar");
        const geoData = await geoResponse.json();
        const place = geoData.results && geoData.results[0];
        if (!place) throw new Error("Ort nicht gefunden");
        const params = new URLSearchParams({
            latitude: place.latitude,
            longitude: place.longitude,
            current: "temperature_2m,weather_code",
            timezone: "auto"
        });
        const response = await fetch("https://api.open-meteo.com/v1/forecast?" + params.toString());
        if (!response.ok) throw new Error("Wetterdaten nicht erreichbar");
        const data = await response.json();
        if (request !== widgetWeatherRequest || !document.querySelector("[data-widget-weather-temp]")) return;
        const weather = weatherDescription(data.current.weather_code);
        temp.textContent = Math.round(data.current.temperature_2m) + "°";
        icon.textContent = weather[1];
        placeLabel.textContent = place.name + (place.admin1 ? ", " + place.admin1 : "");
        descriptionLabel.textContent = weather[0];
    } catch (error) {
        if (request === widgetWeatherRequest && descriptionLabel.isConnected) descriptionLabel.textContent = "Wetter momentan nicht verfügbar.";
    }
}

function addDesktopShortcut(id) {
    if (id !== "trash" && (!apps[id] || !isAppInstalled(id))) {
        notify("Nicht verfügbar", "Installiere die App zuerst im App-Center.");
        return;
    }
    if (desktopShortcuts.includes(id)) {
        notify("Schon vorhanden", "Diese Verknüpfung liegt bereits auf dem Desktop.");
        return;
    }
    desktopShortcuts.push(id);
    renderDesktop();
    saveDesktopShortcuts();
    notify("Desktop-Verknüpfung", (apps[id]?.title || "Papierkorb") + " wurde hinzugefügt.");
}

function removeDesktopShortcut(id) {
    desktopShortcuts = desktopShortcuts.filter(item => item !== id);
    renderDesktop();
    saveDesktopShortcuts();
    hideDesktopMenu();
    notify("Verknüpfung entfernt", "Die App bleibt installiert.");
}

function showDesktopMenu(x, y, appId = null) {
    const menu = document.getElementById("desktopContextMenu");
    if (!menu) return;
    const entries = appId
        ? [
            ['open', 'Öffnen'],
            ['remove', 'Vom Desktop entfernen'],
            ...(Object.prototype.hasOwnProperty.call(APP_CATALOG, appId) ? [['uninstall', 'App deinstallieren']] : [])
          ]
        : [
            ['refresh', 'Aktualisieren'],
            ['store', 'App-Center öffnen']
          ];

    menu.innerHTML = entries.map(([action, label], index) =>
        (index === 1 && !appId ? '<div class="menu-separator"></div>' : '') +
        '<button type="button" data-action="' + action + '">' + label + '</button>'
    ).join("");

    menu.style.display = "block";
    const rect = menu.getBoundingClientRect();
    menu.style.left = Math.max(6, Math.min(x, innerWidth - rect.width - 6)) + "px";
    menu.style.top = Math.max(6, Math.min(y, innerHeight - rect.height - 6)) + "px";

    menu.querySelectorAll("button").forEach(button => {
        button.addEventListener("click", () => {
            const action = button.dataset.action;
            hideDesktopMenu();
            if (action === "open" && appId) appId === "trash" ? openApp("trash") : openApp(appId);
            if (action === "remove" && appId) removeDesktopShortcut(appId);
            if (action === "uninstall" && appId) uninstallApp(appId);
            if (action === "refresh") renderDesktop();
            if (action === "store") openApp("appcenter");
        });
    });
}

function hideDesktopMenu() {
    const menu = document.getElementById("desktopContextMenu");
    if (menu) menu.style.display = "none";
}

function setupDesktopInteractions() {
    const desktop = document.getElementById("desktop");
    const appGrid = document.getElementById("appGrid");
    if (!desktop || desktop.dataset.eventsReady) return;
    desktop.dataset.eventsReady = "true";

    desktop.addEventListener("contextmenu", event => {
        if (event.target.closest(".desktop-icon")) return;
        event.preventDefault();
        showDesktopMenu(event.clientX, event.clientY);
    });

    desktop.addEventListener("dragover", event => {
        event.preventDefault();
        event.dataTransfer.dropEffect = "copy";
    });
    desktop.addEventListener("drop", event => {
        event.preventDefault();
        const id = event.dataTransfer.getData("text/plain");
        if (id) addDesktopShortcut(id);
    });
    desktop.addEventListener("click", event => {
        if (event.target === desktop) {
            selectedDesktopApp = null;
            hideDesktopMenu();
        }
    });

    appGrid?.addEventListener("dragstart", event => {
        const item = event.target.closest(".app-item");
        if (!item) return;
        event.dataTransfer.setData("text/plain", item.dataset.appId);
        event.dataTransfer.effectAllowed = "copy";
    });

    document.addEventListener("pointerdown", event => {
        const insideMenu = event.target.closest(
            "#desktopContextMenu, #startMenu, #notificationCenter, #widgetCenter"
        );
        const menuToggle = event.target.closest(
            ".task-button, .notification-button, #clock"
        );

        if (!insideMenu && !menuToggle) {
            hideDesktopMenu();
            closeFloatingMenus();
        } else if (!insideMenu && menuToggle) {
            hideDesktopMenu();
        }
    });
    document.addEventListener("keydown", event => {
        if (event.key === "Escape") hideDesktopMenu();
    });
}


function closeFloatingMenus(except = "") {
    const menus = [
        ["start", document.getElementById("startMenu")],
        ["notifications", document.getElementById("notificationCenter")],
        ["widgets", document.getElementById("widgetCenter")]
    ];
    menus.forEach(([name, element]) => {

function toggleStart() {

    const menu = document.getElementById("startMenu");
    const shouldOpen = menu.style.display !== "block";
    closeFloatingMenus(shouldOpen ? "start" : "");

    menu.style.display =
        shouldOpen ? "block" : "none";

    if (menu.style.display === "block") {

        document.getElementById("appSearch").value = "";

        renderAppGrid();

        document.getElementById("appSearch").focus();

}

let browserCurrentUrl = "";

function normalizeBrowserAddress(value) {
    let address = String(value || "").trim();
    if (!address) return "";
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(address) &&
        !/^[\w.-]+\.[a-z]{2,}([/:?#]|$)/i.test(address)) {
        return "https://www.google.com/search?q=" + encodeURIComponent(address);
    }
    if (!/^https?:\/\//i.test(address)) address = "https://" + address;
    const url = new URL(address);
    if (!["http:", "https:"].includes(url.protocol)) {
        throw new Error("Nur HTTP- und HTTPS-Adressen sind erlaubt.");
    }
    return url.href;
}

function navigateWeb() {
    const input = document.getElementById("webaddress");
    const frame = document.getElementById("browserFrame");
    const status = document.getElementById("browserStatus");
    if (!input || !frame) return;
    try {
        const address = normalizeBrowserAddress(input.value);
        if (!address) return;
        browserCurrentUrl = address;
        input.value = address;
        if (status) status.textContent = "Lade " + address + " …";
        frame.src = address;
    } catch (error) {
        if (status) status.textContent = error.message || "Ungültige Webadresse.";
    }
}

function browserBack() {
    const frame = document.getElementById("browserFrame");
    try { frame?.contentWindow?.history.back(); } catch {}
}

function browserForward() {
    const frame = document.getElementById("browserFrame");
    try { frame?.contentWindow?.history.forward(); } catch {}
}

function browserReload() {
    const frame = document.getElementById("browserFrame");
    if (!frame) return;
    if (browserCurrentUrl) frame.src = browserCurrentUrl;
    else try { frame.contentWindow.location.reload(); } catch {}
}

function browserOpenExternal() {
    if (!browserCurrentUrl) { navigateWeb(); return; }
    window.open(browserCurrentUrl, "_blank", "noopener,noreferrer");
}

document.addEventListener("load", event => {
    if (event.target && event.target.id === "browserFrame") {
        const status = document.getElementById("browserStatus");
        if (status) status.textContent = "Seite geladen. Falls nichts angezeigt wird, blockiert die Website möglicherweise die Einbettung – nutze ↗.";
    }
}, true);

function formatSessionUptime() {
    const total = Math.floor(performance.now() / 1000);
    const hours = Math.floor(total / 3600);
    const minutes = Math.floor((total % 3600) / 60);
    const seconds = total % 60;
    return hours + " h " + minutes + " min " + seconds + " s";
}

let browserLongTasks = [];
let browserLoadObserver = null;
let browserLoadTimer = null;

function startBrowserLoadMeasurement() {
    if (!browserLoadObserver && "PerformanceObserver" in window) {
        try {
            if (PerformanceObserver.supportedEntryTypes?.includes("longtask")) {
                browserLoadObserver = new PerformanceObserver(list => {
                    const now = performance.now();
                    browserLongTasks.push(...list.getEntries().map(entry => ({
                        start: entry.startTime,
                        duration: entry.duration
                    })));
                    browserLongTasks = browserLongTasks.filter(entry =>
                        entry.start + entry.duration > now - 5000
                    );
                });
                browserLoadObserver.observe({ type: "longtask", buffered: true });
            }
        } catch (error) {
            browserLoadObserver = null;
        }
    }

    if (!browserLoadTimer) {
        browserLoadTimer = setInterval(updateBrowserLoadDisplay, 1000);
    }
    updateBrowserLoadDisplay();
}

function updateBrowserLoadDisplay() {
    const cpu = document.getElementById("monitorCpu");
    if (!cpu) return;

    if (!browserLoadObserver) {
        cpu.textContent = "Nicht unterstützt";
        return;
    }

    const now = performance.now();
    browserLongTasks = browserLongTasks.filter(entry =>
        entry.start + entry.duration > now - 5000
    );
    const busyTime = browserLongTasks.reduce((total, entry) => {
        const overlapStart = Math.max(entry.start, now - 5000);
        const overlapEnd = Math.min(entry.start + entry.duration, now);
        return total + Math.max(0, overlapEnd - overlapStart);
    }, 0);

    cpu.textContent = Math.min(100, Math.round(busyTime / 50)) + " %";
}

function renderSystemMonitor() {
    const cpu = document.getElementById("monitorCpu");
    if (!cpu) return;
    startBrowserLoadMeasurement();

    const ram = document.getElementById("monitorRam");
    const browserMemory = document.getElementById("monitorBrowserMemory");
    const network = document.getElementById("monitorNetwork");
    const screenInfo = document.getElementById("monitorScreen");
    const uptime = document.getElementById("monitorUptime");
    const details = document.getElementById("monitorDetails");
    const nav = navigator;
    const connection = nav.connection || nav.mozConnection || nav.webkitConnection;

    cpu.textContent = nav.hardwareConcurrency
        ? nav.hardwareConcurrency + " Kerne (logisch)"
        : "Nicht verfügbar";

    ram.textContent = Number.isFinite(nav.deviceMemory)
        ? "ca. " + nav.deviceMemory + " GB"
        : "Vom Browser nicht freigegeben";

    const memory = performance.memory;
    browserMemory.textContent = memory
        ? Math.round(memory.usedJSHeapSize / 1048576) + " MB genutzt"
        : "Vom Browser nicht freigegeben";

    network.textContent = nav.onLine ? "Online" : "Offline";
    screenInfo.textContent = screen.width + " × " + screen.height;
    uptime.textContent = formatSessionUptime();

    const connectionText = connection
        ? "Verbindung: " + (connection.effectiveType || "unbekannt") +
          (connection.downlink ? " · " + connection.downlink + " Mbit/s" : "")
        : "Verbindungstyp wird vom Browser nicht freigegeben.";

    details.textContent =
        "Browser: " + nav.userAgent +
        " · Sprache: " + nav.language +
        " · " + connectionText;
}

function runCommand() {

    const input = document.getElementById("terminalInput");
    const output = document.getElementById("terminalOutput");
    if (!input || !output) return;

    const raw = input.value.trim();
    const command = raw.toLowerCase();
    const [name, ...argumentParts] = raw.split(/\\s+/);
    const args = argumentParts.join(" ");
    let result = "";

    if (!raw) return;

    if (command === "clear" || command === "cls") {
        output.innerHTML = "";
        input.value = "";
        return;
    } else if (command === "help") {
        result = "Verfügbare Befehle:\nhelp, about, version, date, time, user, whoami, uptime, sysinfo, memory, network, screen, language, apps, open <app>, echo <text>, clear / cls";
    } else if (command === "about") {
        result = "THYQORA OS – ein browserbasiertes Betriebssystem.";
    } else if (command === "version") {
        result = "THYQORA OS Version 0.9";
    } else if (command === "date") {
        result = new Date().toLocaleDateString("de-DE");
    } else if (command === "time") {
        result = new Date().toLocaleTimeString("de-DE");
    } else if (command === "user" || command === "whoami") {
        result = "Angemeldet als " + (currentUsername || "unbekannt");
    } else if (command === "uptime") {
        result = "Diese Sitzung läuft seit " + formatSessionUptime() + ".";
    } else if (command === "sysinfo" || command === "system") {
        result = "THYQORA OS 0.9 | Browser: " + navigator.userAgent +
            " | " + navigator.hardwareConcurrency + " logische CPU-Kerne" +
            " | Bildschirm: " + screen.width + "x" + screen.height;
    } else if (command === "memory" || command === "ram") {
        result = navigator.deviceMemory
            ? "Vom Browser gemeldeter Gerätespeicher: ca. " + navigator.deviceMemory + " GB."
            : "Der Browser gibt die Gerätespeichergröße nicht frei.";
        if (performance.memory) {
            result += " JavaScript-Speicher: " +
                Math.round(performance.memory.usedJSHeapSize / 1048576) + " MB genutzt.";
        }
    } else if (command === "network") {
        const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        result = (navigator.onLine ? "Online" : "Offline") +
            (conn && conn.effectiveType ? " | Verbindungstyp: " + conn.effectiveType : "");
    } else if (command === "screen") {
        result = screen.width + " x " + screen.height + " Pixel.";
    } else if (command === "language") {
        result = "Browsersprache: " + navigator.language;
    } else if (command === "apps") {
        result = Object.entries(apps)
            .filter(([id]) => isAppInstalled(id))
            .map(([, app]) => app.title)
            .join(", ");
    } else if (name.toLowerCase() === "echo") {
        result = args;
    } else if (name.toLowerCase() === "open") {
        const target = args.toLowerCase();
        const aliases = {systemmonitor:"monitor", monitor:"monitor", taskmanager:"taskmanager",
            "task-manager":"taskmanager", appcenter:"appcenter", "app-center":"appcenter",
            browser:"browser", einstellungen:"settings", settings:"settings", terminal:"terminal", about:"about",
            rechner:"calculator", calculator:"calculator", taschenrechner:"calculator",
            systemsteuerung:"systemcontrol", systemcontrol:"systemcontrol", wetter:"weather", weather:"weather"};
        const app = aliases[target];
        if (app && apps[app]) {
            result = "Öffne " + apps[app].title + " …";
            input.value = "";
            appendTerminalLine(output, raw, result);
            openApp(app);
            return;
        }
        result = "App nicht gefunden. Nutze: apps";
    } else {
        result = "Unbekannter Befehl: " + raw + " – Schreibe help für eine Liste.";
    }

    appendTerminalLine(output, raw, result);
    input.value = "";
}

function appendTerminalLine(output, command, result) {
    const line = document.createElement("div");
    line.style.whiteSpace = "pre-wrap";
    line.textContent = "THYQORA> " + command + (result ? " | " + result : "");
    output.appendChild(line);
    output.parentElement.scrollTop = output.parentElement.scrollHeight;
}

   TASTENKÜRZEL
===================================== */

document.addEventListener("keydown", event => {

    if (!document.body.classList.contains("authenticated")) return;

    const target = event.target;

    const typing =
        target &&
        (
            target.tagName === "INPUT" ||
            target.tagName === "TEXTAREA" ||
            target.isContentEditable
        );

    // Escape schließt Menüs.
    if (event.key === "Escape") {
        document.getElementById("startMenu").style.display = "none";
        document.getElementById("notificationCenter").style.display = "none";
        const widgetCenter = document.getElementById("widgetCenter");
        if (widgetCenter) widgetCenter.style.display = "none";
        return;
    }

    // Strg + Alt + T öffnet das Terminal.
    if (event.ctrlKey && event.altKey && event.key.toLowerCase() === "t") {
        event.preventDefault();
        openApp("terminal");
        return;
    }

    // Strg + Alt + E öffnet das App-Center.
    if (event.ctrlKey && event.altKey && event.key.toLowerCase() === "e") {
        event.preventDefault();
        openApp("appcenter");
        return;
    }

    // Windows-Taste oder F1 öffnet das Startmenü.
    if (
        !typing &&
        (
            event.key === "F1" ||
            event.key === "Meta"
        )
    ) {
        event.preventDefault();
        toggleStart();
    }
});


/* =====================================
   UHR
===================================== */

function updateClock() {

    const now = new Date();

    document.getElementById("clock").innerHTML =
        now.toLocaleTimeString("de-DE", {
            hour: "2-digit",
            minute: "2-digit"
        }) + "<br>" +
        now.toLocaleDateString("de-DE");
    updateDesktopWidgetClock();
}


/* Akzentfarben per Event-Delegation behandeln, damit sie auch nach
   erneutem Rendern eines Fensters zuverlässig reagieren. */
document.addEventListener("click", event => {
    const accentButton = event.target.closest(".accent-choice");
    if (accentButton) {
        event.preventDefault();
        setAccent(accentButton.dataset.accent);
    }
});

/* =====================================
   SYSTEMSTART
===================================== */

renderAppGrid();
setupDesktopInteractions();
renderDesktop();

renderNotifications();

setAuthMode("login");

checkLogin();

updateClock();

setInterval(updateClock, 1000);
setInterval(() => { if (desktopWidgets.includes('weather')) loadDesktopWeatherWidget(); }, 15 * 60 * 1000);

</script>
